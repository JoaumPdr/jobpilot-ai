[project]
name = "jobpilot-ai"
version = "0.1.0"
description = "Assistente pessoal de candidaturas: importa vagas, calcula matching explicavel e organiza o funil. Estudo de orquestracao multiagente."
readme = "README.md"
authors = [
    { name = "jp", email = "joaopedroescobar13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.2",
    "fastapi>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
exclude = [".agents"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
