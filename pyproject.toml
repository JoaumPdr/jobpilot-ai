[project]
name = "jobpilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jp", email = "joaopedroescobar13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
jobpilot-ai = "jobpilot_ai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
exclude = [".agents"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
